<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ごはんログ">
  <title>ごはんログ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>ごはんログ</h1>
    <button id="settingsButton" class="icon-button" aria-label="設定">⚙️</button>
  </header>

  <main>
    <section id="listView" class="view active">
      <div id="emptyState" class="empty">
        <div class="empty-icon">🍽️</div>
        <h2>最初のごはんを記録</h2>
        <p>写真を選ぶと、店とメニューを候補入力します。</p>
      </div>
      <div id="mealGrid" class="meal-grid"></div>
    </section>

    <section id="addView" class="view">
      <form id="mealForm">
        <label class="photo-picker">
          <input id="photoInput" type="file" accept="image/*" required>
          <img id="preview" alt="選択した料理写真">
          <span id="photoPrompt">📷<br>料理写真を選ぶ</span>
        </label>

        <div id="analysisStatus" class="status hidden"><span class="spinner"></span> 店とメニューを予測中…</div>
        <div id="errorMessage" class="error hidden"></div>

        <label>店名<input id="restaurantName" autocomplete="off" placeholder="店名"></label>
        <div id="restaurantCandidates" class="chips"></div>

        <label>メニュー名<input id="menuName" autocomplete="off" placeholder="メニュー名"></label>
        <div id="menuCandidates" class="chips"></div>

        <label>撮影日時<input id="photographedAt" type="datetime-local"></label>
        <button class="primary" type="submit">保存</button>
      </form>
    </section>

    <section id="settingsView" class="view">
      <div class="card">
        <h2>OpenAI API</h2>
        <label>APIキー<input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"></label>
        <button id="saveKeyButton" class="primary" type="button">この端末に保存</button>
        <button id="deleteKeyButton" class="danger" type="button">保存済みキーを削除</button>
        <p id="keyStatus" class="note"></p>
      </div>
      <div class="card">
        <h2>データ</h2>
        <button id="exportButton" type="button">記録をバックアップ</button>
        <p class="note">記録と縮小画像は、このブラウザ内だけに保存されます。Safariのサイトデータを消すと記録も消えるため、定期的にバックアップしてください。</p>
      </div>
      <div class="card">
        <h2>ホーム画面へ追加</h2>
        <p class="note">Safariの共有ボタンから「ホーム画面に追加」を選ぶと、通常のアプリのように起動できます。</p>
      </div>
    </section>

    <section id="detailView" class="view">
      <div id="detailContent"></div>
    </section>
  </main>

  <nav>
    <button data-view="listView" class="active">▦<span>記録</span></button>
    <button data-view="addView" class="add-button">＋<span>追加</span></button>
    <button data-view="settingsView">⚙<span>設定</span></button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
